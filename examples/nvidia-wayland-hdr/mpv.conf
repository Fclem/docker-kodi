# HDR playback player for the Wayland/HDR Kodi image.
#
# Kodi 21 (and the distro build in particular) cannot signal HDR on Wayland --
# its color-management path is Kodi 22/master only -- so HDR/4K material is
# handed to mpv, which does speak color-management-v1 (wp_color_manager_v1).
#
# The compositor (weston, color-management=true, [output] eotf=st2084) is what
# actually puts the TV into HDR; mpv only has to declare what the stream is.

vo=gpu-next
gpu-api=vulkan                 # NVIDIA exposes VK_EXT_hdr_metadata on the Vulkan path
target-colorspace-hint=auto    # let the compositor/display decide the colorspace
hdr-compute-peak=yes

# Only used when the display cannot do HDR (SDR fallback == the X11 image's job)
tone-mapping=bt.2390

# Decode: NVDEC through VA-API (LIBVA_DRIVER_NAME=nvidia is set in the image)
hwdec=vaapi

# Audio: keep it simple and let the TV/AVR do the decoding
audio-channels=stereo
audio-exclusive=no

# TV-friendly behaviour
keep-open=no
fullscreen=yes
osc=no
osd-level=0
