# weston as the display owner for Kodi on the NVIDIA GPU.
#
#	color-management=true enables weston's color management.  It is required to
#	advertise wp_color_manager_v1 to clients (mpv uses it) and required for any
#	non-SDR output mode below.  It needs the GL renderer, hence
#	`weston --backend=drm --renderer=gl` in the entry point.
#
[core]
# kiosk: never blank the TV (the X11 image did the same with xset -dpms)
idle-time=0
#
# color-management=true is what HDR needs (and what [output] eotf below needs).
# It does NOT work on this driver: weston's color-lcms module aborts with
#   color-lcms: error: color operations capability missing. Is GL-renderer not in use?
# because NVIDIA's GLES renderer does not provide the GLES y-flip readback
# ("glReadPixels supports y-flip: no") that weston's colour management requires.
# Until a colour-managed compositor that works on nvidia-drm is in place --
# KWin/Plasma drives HDR through the DRM color pipeline NVIDIA added in the 610
# branch -- this compositor is an SDR pipe.  Everything else (Wayland, Kodi,
# mpv, GPU rendering on the RTX 2070) works.
color-management=false

[output]
# Desired once colour management runs (non-SDR modes require it):
# eotf=st2084

[shell]
# no desktop shell: this is a kiosk, Kodi is the only client
background-color=0xff000000
